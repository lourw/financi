# Toolchain for financi. `mise install` sets up everything cargo needs.
# Linux also needs the GPUI system libraries (X11/Wayland, Vulkan, fontconfig)
# from the distro's package manager; mise can't provide those.

[tools]
rust = { version = "1.99.1", components = "clippy,rustfmt,rust-analyzer,rust-src", profile = "minimal" }

[tasks.build]
run = "cargo build --workspace"

[tasks.test]
run = "cargo test --workspace --features financi-db/dev-seed"

[tasks.lint]
run = "cargo clippy --workspace --all-targets --features financi-db/dev-seed"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.run]
run = "cargo run -p financi"

# Re-render assets/icon/png from assets/icon/financi.svg (needs rsvg-convert).
[tasks.icons]
run = "scripts/icons.sh"

# Linux: install the desktop entry + hicolor icons for the window/taskbar.
[tasks.install-desktop]
run = "scripts/install-desktop.sh"

# macOS: build target/release/financi.app with the .icns (macOS only).
[tasks.bundle]
run = "scripts/bundle-macos.sh"
