[workspace]
resolver = "3"
# spikes/ stays in the tree for reference but is not built: keeping it out
# of the members saves every build, clippy run and verify a GPUI binary (3.90).
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1" # keep in step with the toolchain pinned in mise.toml
license = "MIT"

[workspace.dependencies]
financi-core = { path = "crates/financi-core" }
financi-db = { path = "crates/financi-db" }
financi-parsers = { path = "crates/financi-parsers" }

# GPUI is pre-1.0 and churns weekly: pin exactly and commit Cargo.lock.
# gpui-kit 0.9.0 itself pins gpui-pre =0.3.11.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["runtime_shaders"] }
gpui-kit = { version = "=0.9.0" }

rusqlite = { version = "0.37", features = ["bundled", "backup"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
directories = "6"
thiserror = "2"
anyhow = "1"
regex = "1"

# Smaller debug builds (~5 GB -> roughly half): our crates keep file:line for
# panics and backtraces; dependencies (GPUI, wgpu, ...) carry no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
