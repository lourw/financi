<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- financi app icon source. PNG/ICNS are generated from this file (task 3.63). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27272a"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <!-- macOS grid: 824 px body centred in 1024 with ~185 px corner radius -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <!-- three spending bars, rising -->
  <rect x="262" y="560" width="132" height="200" rx="28" fill="#a1a1aa"/>
  <rect x="446" y="440" width="132" height="320" rx="28" fill="#d4d4d8"/>
  <rect x="630" y="284" width="132" height="476" rx="28" fill="url(#bar)"/>
  <!-- baseline -->
  <rect x="236" y="792" width="552" height="20" rx="10" fill="#fafafa" fill-opacity="0.9"/>
</svg>
