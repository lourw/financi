[package]
name = "financi"
description = "Personal finance: import bank CSV exports into SQLite and see where the money goes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
financi-core.workspace = true
financi-db = { workspace = true, features = ["dev-seed"] }
financi-parsers.workspace = true
gpui-kit.workspace = true
gpui-platform.workspace = true
chrono.workspace = true
# The save-dialog default for Export lives on the Desktop; same crate
# financi-db uses to find the data root.
directories.workspace = true
anyhow.workspace = true
thiserror.workspace = true
# 3.63: decode the embedded app-icon PNG for `WindowOptions::icon`. Same
# version GPUI already pulls in; png-only to keep the tree small.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
# 3.63: set the Dock icon at startup under `cargo run`
# (`window_icon::set_dock_icon`). Versions match what gpui-pre-macos
# already resolves in Cargo.lock.
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[dev-dependencies]
# gpui-kit's own test-support trips a Cargo weak-dependency lockfile bug
# (it resolves gpui-fast, whose exact pins conflict); GPUI's is enough.
gpui = { workspace = true, features = ["test-support"] }
# Already in the lockfile (financi-db's dev-dep); used by the e2e test to
# read fixtures/demo/expected.json.
serde_json = "1.0"
