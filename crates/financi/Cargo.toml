[package]
name = "financi"
description = "Personal finance: import bank CSV exports into SQLite and see where the money goes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
financi-core.workspace = true
financi-db = { workspace = true, features = ["dev-seed"] }
financi-parsers.workspace = true
gpui-kit.workspace = true
gpui-platform.workspace = true
chrono.workspace = true
# The save-dialog default for Export lives on the Desktop; same crate
# financi-db uses to find the data root.
directories.workspace = true
anyhow.workspace = true
thiserror.workspace = true

[dev-dependencies]
# gpui-kit's own test-support trips a Cargo weak-dependency lockfile bug
# (it resolves gpui-fast, whose exact pins conflict); GPUI's is enough.
gpui = { workspace = true, features = ["test-support"] }
# Already in the lockfile (financi-db's dev-dep); used by the e2e test to
# read fixtures/demo/expected.json.
serde_json = "1.0"
